<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
  <title id="title">libcosim software layers and simulation call path</title>
  <desc id="desc">A C++ application sets up a system, creates an execution and algorithm, and reaches a participant through a simulator adapter. FMI participants use the version-specific importer, FMI Library and the FMU shared library. Configuration, interaction and infrastructure are related modules, and Proxy-FMU is an optional remote participant path.</desc>
