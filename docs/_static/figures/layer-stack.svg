    .remote { fill: #fff6e3; stroke: #9a6a18; stroke-width: 2; stroke-dasharray: 6 4; }
    .line { fill: none; stroke: #315b77; stroke-width: 3; marker-end: url(#arrow); }
    .branch { fill: none; stroke: #667580; stroke-width: 2; stroke-dasharray: 6 4; }
    .heading { font: bold 19px sans-serif; fill: #142b3a; }
    .detail { font: 15px sans-serif; fill: #243d4e; }
