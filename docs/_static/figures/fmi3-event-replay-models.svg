<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Connected models for the unexpected event trace</title>
  <desc id="desc">A factor-one FMI 3 event source sends its output to a factor-three ordinary target without Event Mode. At 1.2 seconds the source changes the output from zero to seven. The timeline compares a target with a usable checkpoint and safe replay against one without them.</desc>
  <style>
    .background { fill: #fff; } .box { fill: #eaf3fa; stroke: #315b77; stroke-width: 2; }
    .event { fill: #fff6e3; stroke: #9a6a18; stroke-width: 2; }
    .arrow { fill: none; stroke: #315b77; stroke-width: 3; marker-end: url(#arrow); }
    .label { font: bold 18px sans-serif; fill: #142b3a; } .text { font: 15px sans-serif; fill: #243d4e; }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315b77"/></marker></defs>
  <rect class="background" width="1000" height="190"/>
  <rect class="event" x="35" y="35" width="285" height="120" rx="8"/>
  <text class="label" x="55" y="68">Event source: FMI 3</text>
  <text class="text" x="55" y="96">Factor 1; event at 1.2 s</text>
  <text class="text" x="55" y="123">Output changes 0 to 7</text>
  <rect class="box" x="680" y="35" width="285" height="120" rx="8"/>
  <text class="label" x="700" y="68">Ordinary target</text>
  <text class="text" x="700" y="96">Factor 3; no Event Mode</text>
  <text class="text" x="700" y="123">Input receives source output</text>
  <path class="arrow" d="M320 95 H678"/>
  <text class="text" x="402" y="81">output -&gt; input</text>
  <text class="text" x="357" y="136">Base step 1 s; replay is conditional</text>
</svg>
