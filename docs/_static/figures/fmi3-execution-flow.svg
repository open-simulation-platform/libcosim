<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" role="img" aria-labelledby="title desc">
  <title id="title">FMI 3 Co-Simulation execution flow and feature map</title>
  <desc id="desc">The FMI 3 instance may configure structural parameters before initialization. After initialization it enters Step Mode directly or processes Event Mode first. Runtime reconfiguration of tunable structural parameters is entered from Step Mode. Supported events and clocks can require additional Event Mode transitions.</desc>
  <style>
    .bg { fill: #fff; } .box { fill: #eaf3fa; stroke: #315b77; stroke-width: 2; }
    .event { fill: #fff6e3; stroke: #9a6a18; stroke-width: 2; }
    .chip { fill: #f3f5f7; stroke: #5e6d79; stroke-width: 1.5; }
    .line { fill: none; stroke: #315b77; stroke-width: 3; marker-end: url(#arrow); }
    .heading { font: bold 20px sans-serif; fill: #142b3a; }
    .subheading { font: bold 17px sans-serif; fill: #142b3a; }
    .text { font: 15px sans-serif; fill: #243d4e; }
    .small { font: 14px sans-serif; fill: #243d4e; }
    a:hover rect, a:focus rect { stroke: #005fcc; stroke-width: 4; }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315b77"/></marker></defs>
  <rect class="bg" width="1000" height="1180"/>
  <text class="heading" x="30" y="34">FMI 3 Co-Simulation instance lifecycle</text>

  <a href="../../fmi3/features/instantiation-and-lifecycle.html" target="_top"><rect class="box" x="30" y="80" width="260" height="95" rx="8"/><text class="subheading" x="45" y="110">Instantiated</text><text class="small" x="45" y="136">InstantiateCoSimulation</text><text class="small" x="45" y="157">negotiate Event Mode and early return</text></a>
  <a href="../../fmi3/features/whole-arrays-and-structural-parameters.html" target="_top"><rect class="box" x="370" y="80" width="260" height="95" rx="8"/><text class="subheading" x="385" y="110">Configuration Mode</text><text class="small" x="385" y="136">set fixed or tunable</text><text class="small" x="385" y="157">structural parameters</text></a>
  <a href="../../fmi3/features/instantiation-and-lifecycle.html" target="_top"><rect class="box" x="710" y="80" width="260" height="95" rx="8"/><text class="subheading" x="725" y="110">Initialization Mode</text><text class="small" x="725" y="136">EnterInitializationMode</text><text class="small" x="725" y="157">exchange initial values</text></a>
  <path class="line" d="M290 112 H368"/><path class="line" d="M370 146 H292"/>
  <text class="small" x="300" y="103">enter</text><text class="small" x="300" y="167">exit</text>
  <path class="line" d="M160 80 V55 H840 V78"/>
  <text class="small" x="470" y="50">setup</text>

  <a href="../../fmi3/features/event-mode-and-input-events.html" target="_top"><rect class="event" x="30" y="260" width="420" height="130" rx="8"/><text class="subheading" x="45" y="290">Event Mode (when used)</text><text class="small" x="45" y="316">UpdateDiscreteStates: configured limit</text><text class="small" x="45" y="339">process active Clocks and input events</text><text class="small" x="45" y="362">honor termination and next-event time</text></a>
  <a href="../../fmi3/features/stepping-and-status-handling.html" target="_top"><rect class="box" x="550" y="260" width="420" height="130" rx="8"/><text class="subheading" x="565" y="290">Step Mode</text><text class="small" x="565" y="316">DoStep; inspect status and actual end time</text><text class="small" x="565" y="339">early return and Intermediate Update</text><text class="small" x="565" y="362">are handled when available</text></a>
  <path class="line" d="M840 175 V225 H240 V258"/><text class="small" x="360" y="217">ExitInitializationMode: Event Mode enabled</text>
  <path class="line" d="M840 175 V258"/><text class="small" x="849" y="209">otherwise</text>
  <path class="line" d="M450 305 H548"/><text class="small" x="460" y="295">enter step</text>
  <path class="line" d="M550 355 H452"/><text class="small" x="456" y="379">event request</text>
  <text class="small" x="30" y="423">Non-clocked initial events are iterated before stepping; clocked FMUs remain in initial Event Mode.</text>
  <a href="../../fmi3/features/whole-arrays-and-structural-parameters.html" target="_top"><text class="small" x="30" y="447" text-decoration="underline">Step Mode only: enter Reconfiguration Mode to change tunable structural parameters.</text></a>
  <text class="small" x="30" y="471">Model Exchange-only and Scheduled Execution-only FMUs are not supported.</text>

