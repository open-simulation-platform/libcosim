  <text class="text" x="30" y="1080">Select a box for the linked guide. The execution coordinates the adapter and FMI instance;</text>
  <text class="text" x="30" y="1106">the instance calls FMI Library, which calls the FMU. Results and callbacks flow back.</text>
  <text class="text" x="30" y="1132">The algorithms guide includes mixed-event, rollback and common-grid scheduling timelines.</text>
