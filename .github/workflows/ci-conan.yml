name: CI with Conan

# This workflow is triggered on pushes to the repository.
on: [push, workflow_dispatch]

jobs:
  linux:
    name: Linux
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        build_type: [Debug, Release]
        compiler_version: [14]
        option_proxyfmu: ['proxyfmu=True', 'proxyfmu=False']
        option_shared: ['shared=True', 'shared=False']
    runs-on: ${{ matrix.runner }}
    container:
      image: gcc:${{ matrix.compiler_version }}
    env:
      CONAN_LOGIN_USERNAME_OSP: ${{ secrets.osp_artifactory_usr }}
      CONAN_PASSWORD_OSP: ${{ secrets.osp_artifactory_pwd }}
      CONAN_HOME: ${{ github.workspace }}/.conan2
      LIBCOSIM_RUN_TESTS_ON_CONAN_BUILD: 1
    # Conan Center has no binaries for 64-bit ARM Linux, so the first build
    # there compiles all dependencies.
    timeout-minutes: ${{ matrix.runner == 'ubuntu-24.04-arm' && 120 || 35 }}

    steps:
      - uses: actions/checkout@v6
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y pipx doxygen cmake
          pipx install conan
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure Conan
        run: |
          conan profile detect -f
          conan remote add osp https://osp.jfrog.io/artifactory/api/conan/conan-local --force
      - name: Build package
        shell: bash
        run: |
          REFNAME="${GITHUB_REF#refs/*/}"
          VERSION="v$(<version.txt)"
          if [[ $GITHUB_REF == refs/tags/* ]] && [[ $REFNAME == $VERSION ]]; then CHANNEL="stable"
          elif [[ $REFNAME == master ]]; then CHANNEL="testing"
          else
            SHORT_REFNAME="${REFNAME:0:40}"
            CHANNEL="testing-${SHORT_REFNAME//\//_}"
          fi
          conan create \
            --settings="build_type=${{ matrix.build_type }}" \
            --options="&:${{ matrix.option_proxyfmu }}" \
            --options="*:${{ matrix.option_shared }}" \
            --update \
            --build=missing \
            --build=b2/* \
            --user=osp \
            --channel="${CHANNEL}" \
            .
      - name: Upload package
        run: |
          conan upload --confirm --remote=osp '*'

  windows:
    name: Windows
    runs-on: ${{ matrix.os }}
    env:
      CONAN_LOGIN_USERNAME_OSP: ${{ secrets.osp_artifactory_usr }}
      CONAN_PASSWORD_OSP: ${{ secrets.osp_artifactory_pwd }}
      CONAN_HOME: ${{ github.workspace }}/.conan2
      LIBCOSIM_RUN_TESTS_ON_CONAN_BUILD: 1
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        build_type: [Debug, Release]
        option_proxyfmu: ['proxyfmu=True', 'proxyfmu=False']
        option_shared: ['shared=True', 'shared=False']
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6
      - name: Install prerequisites
        run: |
          pip3 install --upgrade setuptools pip
          pip3 install conan cmake ninja
      - name: Configure Conan
        run: |
          conan profile detect -f
          conan remote add osp https://osp.jfrog.io/artifactory/api/conan/conan-local --force
      - name: Conan create
        shell: bash
        run: |
          REFNAME="${GITHUB_REF#refs/*/}"
          VERSION="v$(<version.txt)"
          if [[ $GITHUB_REF == refs/tags/* ]] && [[ $REFNAME == $VERSION ]]; then CHANNEL="stable"
          elif [[ $REFNAME == master ]]; then CHANNEL="testing"
          else
            SHORT_REFNAME="${REFNAME:0:40}"
            CHANNEL="testing-${SHORT_REFNAME//\//_}"
          fi
          conan create \
            --settings="build_type=${{ matrix.build_type }}" \
            --options="&:${{ matrix.option_proxyfmu }}" \
            --options="*:${{ matrix.option_shared }}" \
            --update \
            --build=missing \
            --user=osp \
            --channel="${CHANNEL}" \
            .
      - name: Conan upload
        run: conan upload --confirm --remote=osp '*'

  macos:
    name: macOS
    runs-on: ${{ matrix.os }}
    env:
      CONAN_LOGIN_USERNAME_OSP: ${{ secrets.osp_artifactory_usr }}
      CONAN_PASSWORD_OSP: ${{ secrets.osp_artifactory_pwd }}
      CONAN_HOME: ${{ github.workspace }}/.conan2
      LIBCOSIM_RUN_TESTS_ON_CONAN_BUILD: 1
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        arch: [armv8, x86_64]
        build_type: [Debug, Release]
        option_proxyfmu: ['proxyfmu=True', 'proxyfmu=False']
        option_shared: ['shared=True', 'shared=False']
        exclude:
          # x86_64 is legacy on macOS, so only build it in Release
          - arch: x86_64
            build_type: Debug
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6
      - name: Install Rosetta
        if: matrix.arch == 'x86_64'
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Install prerequisites
        run: pipx install conan
      - name: Configure Conan
        run: |
          conan profile detect -f
          conan remote add osp https://osp.jfrog.io/artifactory/api/conan/conan-local --force
      - name: Conan create
        shell: bash
        run: |
          REFNAME="${GITHUB_REF#refs/*/}"
          VERSION="v$(<version.txt)"
          if [[ $GITHUB_REF == refs/tags/* ]] && [[ $REFNAME == $VERSION ]]; then CHANNEL="stable"
          elif [[ $REFNAME == master ]]; then CHANNEL="testing"
          else
            SHORT_REFNAME="${REFNAME:0:40}"
            CHANNEL="testing-${SHORT_REFNAME//\//_}"
          fi
          conan create \
            --settings:host="arch=${{ matrix.arch }}" \
            --settings="build_type=${{ matrix.build_type }}" \
            --options="&:${{ matrix.option_proxyfmu }}" \
            --options="*:${{ matrix.option_shared }}" \
            --update \
            --build=missing \
            --user=osp \
            --channel="${CHANNEL}" \
            .
      - name: Conan upload
        run: conan upload --confirm --remote=osp '*'
