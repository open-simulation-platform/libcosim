name: SWIG bindings

# Builds libcosim with the SWIG bindings (Python, Java, C#, and C via SWIG's
# experimental C backend; Julia on top of the C library) and runs the full
# test suite, including the binding tests and the C API drift check
# (swig_c_api_reference), on Linux and Windows.

on:
  push:
    paths:
      - "bindings/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "conanfile.py"
      - ".github/workflows/ci-swig-bindings.yml"
  pull_request:
  workflow_dispatch:

jobs:
  bindings:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      # Makes conanfile.py build the tests and run them (in Conan's run
      # environment, so dependency DLLs are found on Windows).
      LIBCOSIM_RUN_TESTS_ON_CONAN_BUILD: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Conan
        run: pip install conan

      - name: Configure Conan
        run: |
          conan profile detect -f
          conan remote add osp https://osp.jfrog.io/artifactory/api/conan/conan-local --force

      - name: Build and test
        shell: bash
        run: |
          # Make CMake's FindPython3 use the interpreter from setup-python.
          export Python3_ROOT_DIR="${pythonLocation}"
          conan build . \
            --settings=build_type=Release \
            --options="&:swig_bindings=True" \
            --options="&:swig_java=True" \
            --options="&:swig_csharp=True" \
            --build=missing

      - name: Upload generated C header on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cosim_c_wrap-${{ matrix.os }}
          path: build/**/bindings/swig/c/gen/cosim_c_wrap.h
          if-no-files-found: ignore

  packages:
    # Builds the binding packages standalone, against the libcosim Conan
    # package (as a separate bindings repository would), and tests each one
    # with nothing but the package on the search paths.
    name: packages ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install tools
        shell: bash
        run: |
          pip install conan build
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y patchelf; fi

      - name: Configure Conan
        run: |
          conan profile detect -f
          conan remote add osp https://osp.jfrog.io/artifactory/api/conan/conan-local --force

      - name: Create the libcosim package
        # From this commit, as libcosim/<v>@local/testing; the bindings build
        # against it (LIBCOSIM_REF, see bindings/swig/conanfile.py).
        shell: bash
        run: |
          conan create . --user local --channel testing --settings=build_type=Release --build=missing
          echo "LIBCOSIM_REF=libcosim/$(cat version.txt)@local/testing" >> "$GITHUB_ENV"

      - name: Build and test the packages
        working-directory: bindings/swig
        run: python packaging/build_packages.py --test

      - name: Create and test the C package
        working-directory: bindings/swig
        run: conan create . --settings=build_type=Release --build=missing

      - uses: actions/upload-artifact@v4
        with:
          name: libcosim-bindings-${{ matrix.os }}
          path: |
            bindings/swig/build-packages/dist/python/*.whl
            bindings/swig/build-packages/dist/java/*.jar
            bindings/swig/build-packages/dist/csharp/*.nupkg
            bindings/swig/build-packages/dist/julia/
            bindings/swig/build-packages/dist/c/
